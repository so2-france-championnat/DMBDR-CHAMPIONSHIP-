<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DMBDR CHAMPIONSHIP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<!-- =========================
        BACKGROUND
========================= -->

<div class="background"></div>


<!-- =========================
        HEADER
========================= -->

<header class="header">

    <div class="brand">

        <img
            src="logo.jpg"
            class="main-logo"
            alt="DMBDR Championship"
        >

        <div>

            <div class="brand-title">
                DMBDR
            </div>

            <div class="brand-subtitle">
                CHAMPIONSHIP
            </div>

        </div>

    </div>


    <div class="season">

        <span class="live-dot">
            ●
        </span>

        SEASON 1

    </div>

</header>


<!-- =========================
        NAVIGATION
========================= -->

<nav class="navigation">

    <button
        class="nav-button active"
        onclick="showPage('home', this)"
    >
        <span class="nav-icon">⌂</span>
        <span>HOME</span>
    </button>


    <button
        class="nav-button"
        onclick="showPage('teams', this)"
    >
        <span class="nav-icon">♜</span>
        <span>TEAMS</span>
    </button>


    <button
        class="nav-button"
        onclick="showPage('players', this)"
    >
        <span class="nav-icon">♙</span>
        <span>PLAYERS</span>
    </button>


    <button
        class="nav-button"
        onclick="showPage('matches', this)"
    >
        <span class="nav-icon">⚔</span>
        <span>MATCHES</span>
    </button>


    <button
        class="nav-button"
        onclick="showPage('ranking', this)"
    >
        <span class="nav-icon">🏆</span>
        <span>RANKING</span>
    </button>

</nav>


<main>


<!-- =========================
            HOME
========================= -->

<section
    id="home"
    class="page active"
>

    <div class="page-header">

        <div>

            <span class="page-label">
                DMBDR
            </span>

            <h1>
                CHAMPIONSHIP
            </h1>

        </div>

    </div>


    <div class="stats-grid">

        <div
            class="stat-card clickable"
            onclick="showPageById('teams')"
        >

            <span class="stat-label">
                TEAMS
            </span>

            <span
                class="stat-value"
                id="teamCount"
            >
                0
            </span>

        </div>


        <div
            class="stat-card clickable"
            onclick="showPageById('players')"
        >

            <span class="stat-label">
                PLAYERS
            </span>

            <span
                class="stat-value"
                id="playerCount"
            >
                0
            </span>

        </div>


        <div
            class="stat-card clickable"
            onclick="showPageById('matches')"
        >

            <span class="stat-label">
                MATCHES
            </span>

            <span class="stat-value">
                —
            </span>

        </div>


        <div
            class="stat-card clickable"
            onclick="showPageById('ranking')"
        >

            <span class="stat-label">
                RANKING
            </span>

            <span class="stat-value">
                TOP
            </span>

        </div>

    </div>


    <div class="home-card">

        <div class="home-card-title">
            SEASON 1
        </div>

        <div class="home-card-text">
            DMBDR CHAMPIONSHIP
        </div>

        <div class="home-card-line"></div>

        <div class="home-card-status">
            ● CHAMPIONSHIP ACTIVE
        </div>

    </div>

</section>


<!-- =========================
            TEAMS
========================= -->

<section
    id="teams"
    class="page"
>

    <div class="page-header">

        <div>

            <span class="page-label">
                CHAMPIONSHIP
            </span>

            <h1>
                TEAMS
            </h1>

        </div>


        <div
            class="page-count"
            id="teamPageCount"
        >
            0
        </div>

    </div>


    <!-- LISTE DES ÉQUIPES -->

    <div
        id="teamList"
        class="content-list"
    >
    </div>


    <!-- FICHE ÉQUIPE -->

    <div
        id="teamDetails"
        class="team-details"
    >
    </div>

</section>


<!-- =========================
            PLAYERS
========================= -->

<section
    id="players"
    class="page"
>

    <div class="page-header">

        <div>

            <span class="page-label">
                CHAMPIONSHIP
            </span>

            <h1>
                PLAYERS
            </h1>

        </div>


        <div
            class="page-count"
            id="playerPageCount"
        >
            0
        </div>

    </div>


    <div
        id="playerList"
        class="content-list"
    >
    </div>

</section>


<!-- =========================
            MATCHES
========================= -->

<section
    id="matches"
    class="page"
>

    <div class="page-header">

        <div>

            <span class="page-label">
                CHAMPIONSHIP
            </span>

            <h1>
                MATCHES
            </h1>

        </div>

    </div>


    <div class="empty-card">

        MATCH SYSTEM

        <span>
            Coming soon
        </span>

    </div>

</section>


<!-- =========================
            RANKING
========================= -->

<section
    id="ranking"
    class="page"
>

    <div class="page-header">

        <div>

            <span class="page-label">
                CHAMPIONSHIP
            </span>

            <h1>
                RANKING
            </h1>

        </div>

    </div>


    <div
        id="rankingList"
        class="content-list"
    >
    </div>

</section>


</main>


<script src="app.js"></script>

</body>

</html>
